[project]
name = "atommovr-controller"
version = "0.1.0"
description = "Closed-loop AOD rearrangement: imaging, AWG control, and atommovr algorithms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atommovr",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "atommovr_controller",
    "atommovr_controller.imaging",
    "awg_controller",
    "recorder",
]

[tool.uv.workspace]
members = [
    "atommovr",
]

[tool.uv.sources]
atommovr = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
hardware = [
  "spcm",
  "cuda-python ; sys_platform == 'linux'",
  "cupy-cuda12x[ctk] ; sys_platform == 'linux'",
  "vmbpy",
]

[tool.pytest.ini_options]
testpaths = ["awg_controller/tests", "atommovr_controller/tests", "recorder/tests"]
